# VAE Path B (PyTorch) Configuration

# Data
data:
  dataset: "fashion_mnist"
  image_size: 28
  channels: 1
  data_dir: "../../data/"
  train_split: 0.9
  val_split: 0.1

# Model architecture
model:
  input_dim: 784
  encoder_hidden_dims: [512, 256]
  latent_dim: 20
  decoder_hidden_dims: [256, 512]
  output_dim: 784

# Training
training:
  batch_size: 128
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-5
  grad_clip: 1.0
  early_stopping_patience: 15

# Optimizer and scheduler
optimizer:
  name: "adam"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "cosine"  # cosine, step, exponential
  warmup_epochs: 5

# Loss weights
loss:
  reconstruction_weight: 1.0
  kl_weight: 1.0

# Validation and checkpointing
validation:
  val_interval: 1  # Validate every N epochs
  save_best: true

checkpoint:
  save_dir: "./results/checkpoints/"
  save_interval: 10

# Logging
logging:
  log_dir: "./results/"
  save_samples: true
  sample_interval: 10
  verbose: true

# Hardware (MacBook Air - use CPU for simplicity)
device: "cpu"  # Use cpu on MacBook Air (most straightforward)
seed: 42
num_workers: 0  # Set to 0 on MacBook for data loading
